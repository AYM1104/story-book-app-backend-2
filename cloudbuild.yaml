# Cloud Build設定ファイル
steps:
  # Dockerイメージをビルド
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '--no-cache', '-t', 'gcr.io/$PROJECT_ID/story-book-backend:$BUILD_ID', '.']
  
  # DockerイメージをGoogle Container Registryにプッシュ
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/story-book-backend:$BUILD_ID']
  
  # Cloud Runにデプロイ
  # Secret Managerから環境変数を読み込む
  # カスタムサービスアカウントを使用（わかりやすい名前）
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ehonnotane-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/story-book-backend:$BUILD_ID'
      - '--region'
      - 'us-west1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--service-account'
      - 'ehonnotane-backend-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--max-instances'
      - '10'
      - '--set-secrets'
      - 'SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_ANON_KEY=SUPABASE_ANON_KEY:latest,SUPABASE_DB_URL=SUPABASE_DB_URL:latest,GOOGLE_API_KEY_Free=GOOGLE_API_KEY_Free:latest,GOOGLE_API_KEY_Paid=GOOGLE_API_KEY_Paid:latest,GCS_BUCKET_NAME=GCS_BUCKET_NAME:latest,SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest,AUTH0_DOMAIN=AUTH0_DOMAIN:latest,AUTH0_API_AUDIENCE=AUTH0_API_AUDIENCE:latest,AUTH0_NATIVE_CLIENT_ID=AUTH0_NATIVE_CLIENT_ID:latest,BACKEND_URL=BACKEND_URL:latest'
      - '--set-env-vars'
      - 'STORAGE_TYPE=gcs,CLOUD_TASKS_LOCATION=us-west1,CLOUD_TASKS_QUEUE=image-generation-queue,CLOUD_TASKS_SERVICE_ACCOUNT=ehonnotane-backend-sa@$PROJECT_ID.iam.gserviceaccount.com'
      - '--timeout'
      - '600'

# 使用するイメージ
images:
  - 'gcr.io/$PROJECT_ID/story-book-backend:$BUILD_ID'

# タイムアウト設定（20分）
timeout: '1200s'
