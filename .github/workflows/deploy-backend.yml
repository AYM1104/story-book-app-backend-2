name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'cloudbuild.yaml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP Configuration
        run: |
          echo "🔍 GCP設定を確認中..."
          PROJECT_ID=$(gcloud config get-value project 2>/dev/null || echo "")
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ エラー: PROJECT_IDが設定されていません"
            echo "gcloud config set project YOUR_PROJECT_ID を実行してください"
            exit 1
          fi
          echo "✅ Project ID: $PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Enable Required APIs
        run: |
          echo "🔧 必要なAPIを有効化中..."
          PROJECT_ID=$(gcloud config get-value project)
          
          # 必要なAPIのリスト
          REQUIRED_APIS=(
            "secretmanager.googleapis.com"
            "cloudbuild.googleapis.com"
            "run.googleapis.com"
            "containerregistry.googleapis.com"
            "logging.googleapis.com"
            "cloudresourcemanager.googleapis.com"
            "iam.googleapis.com"
          )
          
          FAILED_APIS=()
          for api in "${REQUIRED_APIS[@]}"; do
            echo "📋 $api を確認中..."
            if gcloud services list --enabled --filter="name:$api" --format="value(name)" --project=$PROJECT_ID | grep -q "$api"; then
              echo "✅ $api は既に有効です"
            else
              echo "🔧 $api を有効化中..."
              if gcloud services enable $api --project=$PROJECT_ID 2>&1; then
                echo "✅ $api の有効化に成功しました"
                echo "⏳ APIの有効化が反映されるまで少し待機します..."
                sleep 10
              else
                echo "❌ $api の有効化に失敗しました"
                FAILED_APIS+=("$api")
              fi
            fi
          done
          
          if [ ${#FAILED_APIS[@]} -gt 0 ]; then
            echo ""
            echo "⚠️ 以下のAPIの有効化に失敗しました:"
            for api in "${FAILED_APIS[@]}"; do
              echo "  - $api"
            done
            echo ""
            echo "💡 解決方法:"
            echo "1. Google Cloud Consoleから手動で有効化:"
            echo "   https://console.developers.google.com/apis/library?project=$PROJECT_ID"
            echo ""
            echo "2. または、サービスアカウントに権限を付与:"
            echo "   gcloud projects add-iam-policy-binding $PROJECT_ID \\"
            echo "     --member=\"serviceAccount:YOUR_SERVICE_ACCOUNT@$PROJECT_ID.iam.gserviceaccount.com\" \\"
            echo "     --role=\"roles/serviceusage.serviceUsageAdmin\""
            echo ""
            echo "3. または、プロジェクトオーナー権限を付与:"
            echo "   gcloud projects add-iam-policy-binding $PROJECT_ID \\"
            echo "     --member=\"serviceAccount:YOUR_SERVICE_ACCOUNT@$PROJECT_ID.iam.gserviceaccount.com\" \\"
            echo "     --role=\"roles/owner\""
            echo ""
            echo "⚠️ 警告: APIが有効化されていない場合、デプロイが失敗する可能性があります"
          else
            echo "✅ すべてのAPIの確認が完了しました"
          fi

      - name: Grant Secret Manager Permissions
        run: |
          echo "🔐 Cloud RunサービスアカウントにSecret Manager権限を付与中..."
          PROJECT_ID=$(gcloud config get-value project)
          PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')
          
          # Cloud Runのデフォルトサービスアカウントに権限を付与
          SERVICE_ACCOUNT="$PROJECT_NUMBER-compute@developer.gserviceaccount.com"
          echo "サービスアカウント: $SERVICE_ACCOUNT"
          
          echo "Secret Manager Secret Accessor権限を付与中..."
          gcloud projects add-iam-policy-binding $PROJECT_ID \
            --member="serviceAccount:$SERVICE_ACCOUNT" \
            --role="roles/secretmanager.secretAccessor" \
            --condition=None || echo "⚠️ 権限の付与に失敗しました（既に付与されている可能性があります）"
          
          echo "✅ 権限の付与が完了しました"

      - name: Verify Secret Manager Secrets
        run: |
          echo "🔍 Secret Managerの設定を確認中..."
          PROJECT_ID=$(gcloud config get-value project)
          REQUIRED_SECRETS=("SUPABASE_URL" "SUPABASE_ANON_KEY" "SUPABASE_DB_URL" "GEMINI_API_KEY" "GCS_BUCKET_NAME" "SUPABASE_SERVICE_ROLE_KEY" "GOOGLE_API_KEY")
          MISSING_SECRETS=()
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if ! gcloud secrets describe "$secret" --project=$PROJECT_ID >/dev/null 2>&1; then
              MISSING_SECRETS+=("$secret")
            fi
          done
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "⚠️ 警告: 以下のシークレットが設定されていません:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "  - $secret"
            done
            echo ""
            echo "シークレットを作成するには:"
            echo "  echo 'your-value' | gcloud secrets create SECRET_NAME --data-file=- --project=$PROJECT_ID"
            echo ""
            echo "デプロイは続行しますが、サービスが正常に動作しない可能性があります。"
          else
            echo "✅ すべての必須シークレットが設定されています"
          fi

      - name: Submit Cloud Build
        id: build
        run: |
          echo "🔨 Cloud Buildを開始します..."
          PROJECT_ID=$(gcloud config get-value project)
          echo "Project ID: $PROJECT_ID"
          BUILD_ID=$(gcloud builds submit --config cloudbuild.yaml --async --format="value(id)" --project=$PROJECT_ID .)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "✅ Cloud Build submitted: $BUILD_ID"
          echo "🔗 Logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"

      - name: Wait for Build Completion
        id: wait_build
        run: |
          BUILD_ID=${{ steps.build.outputs.build_id }}
          PROJECT_ID=$(gcloud config get-value project)
          echo "⏳ Waiting for build $BUILD_ID to complete..."
          for i in {1..60}; do
            STATUS=$(gcloud builds describe $BUILD_ID --project=$PROJECT_ID --format="value(status)" 2>/dev/null || echo "QUEUED")
            echo "Status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Build completed successfully!"
              exit 0
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Build failed: $STATUS"
              echo "🔗 Check logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
              echo "build_status=FAILED" >> $GITHUB_OUTPUT
              exit 1
            fi
            sleep 10
          done
          echo "⚠️ Build timeout after 10 minutes"
          echo "build_status=TIMEOUT" >> $GITHUB_OUTPUT
          exit 1

      - name: Show Build Logs on Failure
        if: failure()
        run: |
          BUILD_ID=${{ steps.build.outputs.build_id }}
          PROJECT_ID=$(gcloud config get-value project)
          echo "📋 Cloud Buildのエラー情報を取得中..."
          echo "=========================================="
          
          # ビルドの詳細情報を取得
          echo "🔍 ビルドの詳細情報:"
          gcloud builds describe $BUILD_ID --project=$PROJECT_ID --format="yaml" || echo "ビルド情報の取得に失敗しました"
          
          echo ""
          echo "📝 エラーログを取得中..."
          # Cloud Loggingからログを取得（最後の100行）
          gcloud logging read "resource.type=build AND resource.labels.build_id=$BUILD_ID" \
            --project=$PROJECT_ID \
            --limit=100 \
            --format="table(timestamp,severity,textPayload)" \
            --order=desc || echo "ログの取得に失敗しました（Cloud Logging APIの権限が必要です）"
          
          echo "=========================================="
          echo "🔗 詳細なログ（Cloud Console）:"
          echo "https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
          echo ""
          echo "💡 よくある問題と解決方法:"
          echo ""
          echo "1. Cloud Resource Manager APIが有効化されていない（SERVICE_DISABLEDエラー）"
          echo "   → https://console.developers.google.com/apis/api/cloudresourcemanager.googleapis.com/overview?project=$PROJECT_ID"
          echo "   → または: gcloud services enable cloudresourcemanager.googleapis.com --project=$PROJECT_ID"
          echo "   → 注意: GitHub Actionsのサービスアカウントに権限がない場合は、手動で有効化が必要です"
          echo ""
          echo "2. Secret Manager APIが有効化されていない"
          echo "   → https://console.developers.google.com/apis/api/secretmanager.googleapis.com/overview?project=$PROJECT_ID"
          echo "   → または: gcloud services enable secretmanager.googleapis.com --project=$PROJECT_ID"
          echo ""
          echo "3. Cloud RunサービスアカウントにSecret Manager権限が不足している"
          echo "   → PROJECT_NUMBER=\$(gcloud projects describe $PROJECT_ID --format='value(projectNumber)')"
          echo "   → gcloud projects add-iam-policy-binding $PROJECT_ID \\"
          echo "       --member=\"serviceAccount:\$PROJECT_NUMBER-compute@developer.gserviceaccount.com\" \\"
          echo "       --role=\"roles/secretmanager.secretAccessor\""
          echo ""
          echo "4. Secret Managerのシークレットが存在しない"
          echo "   → gcloud secrets list --project=$PROJECT_ID で確認"
          echo "   → 作成: echo 'value' | gcloud secrets create SECRET_NAME --data-file=- --project=$PROJECT_ID"
          echo ""
          echo "5. GitHub ActionsのサービスアカウントにAPI有効化権限が不足している"
          echo "   → サービスアカウントに以下の権限を付与:"
          echo "   → gcloud projects add-iam-policy-binding $PROJECT_ID \\"
          echo "       --member=\"serviceAccount:YOUR_SERVICE_ACCOUNT@$PROJECT_ID.iam.gserviceaccount.com\" \\"
          echo "       --role=\"roles/serviceusage.serviceUsageAdmin\""
          echo ""
          echo "6. Cloud Buildのサービスアカウントに権限が不足している"
          echo "   → Cloud Build APIが有効か確認"
          echo ""
          echo "7. Cloud Runへのデプロイ権限が不足している"
          echo "   → Cloud Run Admin権限が必要"
          echo ""
          echo "8. Dockerイメージのビルドエラー"
          echo "   → requirements.txtやDockerfileを確認"
          echo ""
          echo "📋 ビルドステップの詳細を確認するには:"
          echo "gcloud builds describe $BUILD_ID --project=$PROJECT_ID"

      - name: Get Service URL
        id: service_url
        run: |
          SERVICE_URL=$(gcloud run services describe ehonnotane-backend --region=us-west1 --format="value(status.url)" 2>/dev/null || echo "")
          if [ -n "$SERVICE_URL" ]; then
            echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
            echo "🌐 Service URL: $SERVICE_URL"
          else
            echo "⚠️ Service URL could not be retrieved"
          fi

      - name: Health Check
        if: steps.service_url.outputs.service_url != ''
        run: |
          SERVICE_URL=${{ steps.service_url.outputs.service_url }}
          echo "🔍 ヘルスチェックを実行中..."
          sleep 5  # サービスが起動するまで少し待つ
          if curl -s -f "$SERVICE_URL/health" > /dev/null 2>&1; then
            echo "✅ サービスが正常に動作しています"
          else
            echo "⚠️ ヘルスチェックに失敗しました（サービスが起動中かもしれません）"
            echo "ログを確認してください:"
            echo "gcloud run services logs read ehonnotane-backend --region=us-west1 --limit=50"
          fi

