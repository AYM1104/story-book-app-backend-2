name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'cloudbuild.yaml'
      - '.github/workflows/deploy-backend.yml'

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify GCP Configuration
        run: |
          echo "🔍 GCP設定を確認中..."
          PROJECT_ID=$(gcloud config get-value project 2>/dev/null || echo "")
          if [ -z "$PROJECT_ID" ]; then
            echo "❌ エラー: PROJECT_IDが設定されていません"
            echo "gcloud config set project YOUR_PROJECT_ID を実行してください"
            exit 1
          fi
          echo "✅ Project ID: $PROJECT_ID"
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Verify Secret Manager Secrets
        run: |
          echo "🔍 Secret Managerの設定を確認中..."
          REQUIRED_SECRETS=("SUPABASE_URL" "SUPABASE_ANON_KEY" "SUPABASE_DB_URL" "GEMINI_API_KEY" "GCS_BUCKET_NAME")
          MISSING_SECRETS=()
          for secret in "${REQUIRED_SECRETS[@]}"; do
            if ! gcloud secrets describe "$secret" >/dev/null 2>&1; then
              MISSING_SECRETS+=("$secret")
            fi
          done
          if [ ${#MISSING_SECRETS[@]} -gt 0 ]; then
            echo "⚠️ 警告: 以下のシークレットが設定されていません:"
            for secret in "${MISSING_SECRETS[@]}"; do
              echo "  - $secret"
            done
            echo "デプロイは続行しますが、サービスが正常に動作しない可能性があります。"
          else
            echo "✅ すべての必須シークレットが設定されています"
          fi

      - name: Submit Cloud Build
        id: build
        run: |
          echo "🔨 Cloud Buildを開始します..."
          PROJECT_ID=$(gcloud config get-value project)
          echo "Project ID: $PROJECT_ID"
          BUILD_ID=$(gcloud builds submit --config cloudbuild.yaml --async --format="value(id)" --project=$PROJECT_ID .)
          echo "build_id=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "✅ Cloud Build submitted: $BUILD_ID"
          echo "🔗 Logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"

      - name: Wait for Build Completion
        id: wait_build
        run: |
          BUILD_ID=${{ steps.build.outputs.build_id }}
          PROJECT_ID=$(gcloud config get-value project)
          echo "⏳ Waiting for build $BUILD_ID to complete..."
          for i in {1..60}; do
            STATUS=$(gcloud builds describe $BUILD_ID --project=$PROJECT_ID --format="value(status)" 2>/dev/null || echo "QUEUED")
            echo "Status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ]; then
              echo "✅ Build completed successfully!"
              exit 0
            elif [ "$STATUS" = "FAILURE" ] || [ "$STATUS" = "TIMEOUT" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "❌ Build failed: $STATUS"
              echo "🔗 Check logs: https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
              echo "build_status=FAILED" >> $GITHUB_OUTPUT
              exit 1
            fi
            sleep 10
          done
          echo "⚠️ Build timeout after 10 minutes"
          echo "build_status=TIMEOUT" >> $GITHUB_OUTPUT
          exit 1

      - name: Show Build Logs on Failure
        if: failure()
        run: |
          BUILD_ID=${{ steps.build.outputs.build_id }}
          PROJECT_ID=$(gcloud config get-value project)
          echo "📋 Cloud Buildのエラー情報を取得中..."
          echo "=========================================="
          
          # ビルドの詳細情報を取得
          echo "🔍 ビルドの詳細情報:"
          gcloud builds describe $BUILD_ID --project=$PROJECT_ID --format="yaml" || echo "ビルド情報の取得に失敗しました"
          
          echo ""
          echo "📝 エラーログを取得中..."
          # Cloud Loggingからログを取得（最後の100行）
          gcloud logging read "resource.type=build AND resource.labels.build_id=$BUILD_ID" \
            --project=$PROJECT_ID \
            --limit=100 \
            --format="table(timestamp,severity,textPayload)" \
            --order=desc || echo "ログの取得に失敗しました（Cloud Logging APIの権限が必要です）"
          
          echo "=========================================="
          echo "🔗 詳細なログ（Cloud Console）:"
          echo "https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=$PROJECT_ID"
          echo ""
          echo "💡 よくある問題と解決方法:"
          echo "1. Secret Managerのシークレットが存在しない"
          echo "   → gcloud secrets list で確認"
          echo "2. Cloud Buildのサービスアカウントに権限が不足している"
          echo "   → Cloud Build APIが有効か確認"
          echo "3. Cloud Runへのデプロイ権限が不足している"
          echo "   → Cloud Run Admin権限が必要"
          echo "4. Dockerイメージのビルドエラー"
          echo "   → requirements.txtやDockerfileを確認"
          echo ""
          echo "📋 ビルドステップの詳細を確認するには:"
          echo "gcloud builds describe $BUILD_ID --project=$PROJECT_ID"

      - name: Get Service URL
        id: service_url
        run: |
          SERVICE_URL=$(gcloud run services describe ehonnotane-backend --region=us-west1 --format="value(status.url)" 2>/dev/null || echo "")
          if [ -n "$SERVICE_URL" ]; then
            echo "service_url=$SERVICE_URL" >> $GITHUB_OUTPUT
            echo "🌐 Service URL: $SERVICE_URL"
          else
            echo "⚠️ Service URL could not be retrieved"
          fi

      - name: Health Check
        if: steps.service_url.outputs.service_url != ''
        run: |
          SERVICE_URL=${{ steps.service_url.outputs.service_url }}
          echo "🔍 ヘルスチェックを実行中..."
          sleep 5  # サービスが起動するまで少し待つ
          if curl -s -f "$SERVICE_URL/health" > /dev/null 2>&1; then
            echo "✅ サービスが正常に動作しています"
          else
            echo "⚠️ ヘルスチェックに失敗しました（サービスが起動中かもしれません）"
            echo "ログを確認してください:"
            echo "gcloud run services logs read ehonnotane-backend --region=us-west1 --limit=50"
          fi

